<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">LexVoice introduction image</title>
  <desc id="desc">A marketing-style introduction graphic for LexVoice, showing the brand, core promise, and an Obsidian-style recording, transcript, clean draft, and sediment workflow interface.</desc>
  <defs>
    <linearGradient id="left-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6250b7"/>
      <stop offset="0.52" stop-color="#415f9a"/>
      <stop offset="1" stop-color="#227b82"/>
    </linearGradient>
    <linearGradient id="icon-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5d0ff"/>
      <stop offset="0.44" stop-color="#a68bff"/>
      <stop offset="1" stop-color="#56d6ca"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9f8cff"/>
      <stop offset="1" stop-color="#48d7cc"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#242230"/>
      <stop offset="1" stop-color="#17191f"/>
    </linearGradient>
    <filter id="big-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#090a10" flood-opacity="0.42"/>
    </filter>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#07090f" flood-opacity="0.32"/>
    </filter>
    <clipPath id="window-clip">
      <rect x="532" y="170" width="700" height="520" rx="12"/>
    </clipPath>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; }
      .left-title { font: 760 68px/1.05 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; fill: #ffffff; }
      .left-copy { font: 730 34px/1.42 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; letter-spacing: 0; fill: #ffffff; }
      .left-small { font: 600 15px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .02em; fill: rgba(255,255,255,.82); }
      .win-text { font: 600 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; letter-spacing: 0; fill: #f4f2ff; }
      .win-muted { fill: #a7a1b8; font-weight: 520; }
      .win-faint { fill: #746f83; font-weight: 520; }
      .win-title { font-size: 18px; font-weight: 760; fill: #f9f7ff; }
      .win-h2 { font-size: 14px; font-weight: 730; fill: #f9f7ff; }
      .pill-text { font-size: 10px; font-weight: 760; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect width="1280" height="800" fill="#17191f"/>
  <rect x="0" y="0" width="532" height="800" fill="url(#left-bg)"/>
  <path d="M0 690 C148 620 246 720 388 646 C450 614 493 573 532 538 L532 800 L0 800 Z" fill="#1f2636" opacity=".23"/>
  <path d="M0 0 L532 0 L532 800 C485 641 471 479 532 312 C452 355 381 338 320 256 C235 143 124 108 0 126 Z" fill="#ffffff" opacity=".055"/>

  <g transform="translate(116 110)" filter="url(#big-shadow)">
    <path d="M89 1 C115 10 135 33 141 61 C154 71 164 84 166 101 C170 132 149 160 119 167 C99 186 65 191 40 174 C13 168 -5 143 2 116 C-3 89 11 65 36 54 C45 27 62 9 89 1 Z" fill="url(#icon-fill)"/>
    <path d="M88 2 C104 40 86 68 74 88 C62 108 61 133 83 164 C65 172 41 169 23 157 C39 127 43 98 23 71 C34 44 55 18 88 2 Z" fill="#ffffff" opacity=".46"/>
    <path d="M36 108 C50 91 65 86 82 91 C104 97 115 116 126 137" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" opacity=".68"/>
    <path d="M45 88 L45 134 M66 72 L66 150 M87 61 L87 162 M108 76 L108 147 M129 99 L129 131" stroke="#181923" stroke-width="7" stroke-linecap="round" opacity=".22"/>
  </g>

  <text class="left-title" x="84" y="420">LexVoice</text>
  <g class="ui left-copy">
    <text x="84" y="500">录音、转写、清稿</text>
    <text x="84" y="548">与沉淀的 Obsidian</text>
    <text x="84" y="596">工作台</text>
  </g>
  <g transform="translate(84 650)">
    <rect x="0" y="0" width="284" height="42" rx="21" fill="#ffffff" opacity=".14"/>
    <circle cx="23" cy="21" r="6" fill="#5ee2d6"/>
    <text class="ui left-small" x="43" y="27">Local-first · Bring your own API</text>
  </g>

  <g clip-path="url(#window-clip)" filter="url(#big-shadow)">
    <rect x="532" y="170" width="700" height="520" rx="12" fill="#111216"/>
    <rect x="532" y="170" width="700" height="36" fill="#202128"/>
    <circle cx="552" cy="188" r="4" fill="#5b5d68"/>
    <circle cx="568" cy="188" r="4" fill="#5b5d68"/>
    <circle cx="584" cy="188" r="4" fill="#5b5d68"/>
    <rect x="612" y="178" width="112" height="20" rx="6" fill="#2a2b34"/>
    <text class="ui win-text" x="625" y="192">LexVoice</text>
    <text class="ui win-text win-muted" x="942" y="192">Private / Obsidian Vault</text>

    <rect x="532" y="206" width="140" height="484" fill="#17181f"/>
    <text class="ui win-text win-muted" x="555" y="234">RECENT NOTES</text>
    <g transform="translate(552 254)">
      <rect x="0" y="0" width="96" height="54" rx="8" fill="#26243a"/>
      <rect x="8" y="10" width="52" height="8" rx="4" fill="#e8e2ff" opacity=".92"/>
      <rect x="8" y="26" width="74" height="6" rx="3" fill="#8f88a7"/>
      <rect x="8" y="39" width="46" height="6" rx="3" fill="#5ee2d6" opacity=".75"/>
    </g>
    <g transform="translate(552 322)">
      <rect x="0" y="0" width="96" height="48" rx="8" fill="#202127"/>
      <rect x="8" y="10" width="66" height="7" rx="3.5" fill="#9b95ae"/>
      <rect x="8" y="25" width="42" height="6" rx="3" fill="#6f6a7b"/>
    </g>
    <g transform="translate(552 384)">
      <rect x="0" y="0" width="96" height="48" rx="8" fill="#202127"/>
      <rect x="8" y="10" width="58" height="7" rx="3.5" fill="#9b95ae"/>
      <rect x="8" y="25" width="70" height="6" rx="3" fill="#6f6a7b"/>
    </g>
    <g transform="translate(552 614)">
      <rect x="0" y="0" width="96" height="36" rx="18" fill="#2a2738"/>
      <circle cx="20" cy="18" r="7" fill="#56d6ca"/>
      <text class="ui win-text" x="36" y="22">Recording</text>
    </g>

    <rect x="672" y="206" width="560" height="484" fill="#15161c"/>
    <g transform="translate(700 232)">
      <text class="ui win-title" x="0" y="0">实时大纲</text>
      <rect x="92" y="-17" width="78" height="24" rx="12" fill="#2b2434"/>
      <circle cx="108" cy="-5" r="5" fill="#ff6f91"/>
      <text class="ui win-text pill-text" x="120" y="-1" fill="#f4c4d0">00:28:14</text>
      <text class="ui win-text win-muted" x="402" y="0">ASR: streaming</text>
    </g>

    <g transform="translate(700 256)" filter="url(#soft-shadow)">
      <rect x="0" y="0" width="250" height="206" rx="12" fill="url(#card)" stroke="#2e3040"/>
      <line x1="24" y1="42" x2="24" y2="176" stroke="#34364a" stroke-width="2"/>
      <circle cx="24" cy="42" r="7" fill="#9f8cff"/>
      <circle cx="24" cy="93" r="6" fill="#5ee2d6"/>
      <circle cx="24" cy="144" r="6" fill="#6c6f82"/>
      <text class="ui win-text" x="44" y="47">客户访谈目标确认</text>
      <text class="ui win-text win-muted" x="44" y="65">08:12 · 需求边界和决策人</text>
      <text class="ui win-text" x="44" y="98">方案取舍</text>
      <text class="ui win-text win-muted" x="44" y="116">14:40 · 价格、风险、迁移成本</text>
      <text class="ui win-text win-muted" x="44" y="149">下一步行动</text>
      <text class="ui win-text win-faint" x="44" y="167">自动补全中...</text>
    </g>

    <g transform="translate(970 256)" filter="url(#soft-shadow)">
      <rect x="0" y="0" width="222" height="206" rx="12" fill="url(#card)" stroke="#2e3040"/>
      <text class="ui win-h2" x="18" y="28">会中补充</text>
      <rect x="18" y="44" width="186" height="40" rx="9" fill="#1b1d25" stroke="#34364a"/>
      <text class="ui win-text win-muted" x="32" y="68">#概念 机会成本</text>
      <rect x="18" y="98" width="55" height="24" rx="12" fill="#29243b"/>
      <text class="ui win-text pill-text" x="32" y="114" fill="#c7bfff"># 概念</text>
      <rect x="80" y="98" width="58" height="24" rx="12" fill="#1e3032"/>
      <text class="ui win-text pill-text" x="96" y="114" fill="#90f0e7">? 问题</text>
      <rect x="145" y="98" width="58" height="24" rx="12" fill="#37242c"/>
      <text class="ui win-text pill-text" x="160" y="114" fill="#ffb2c3">! 重点</text>
      <rect x="18" y="134" width="85" height="24" rx="12" fill="#24252d"/>
      <text class="ui win-text pill-text" x="35" y="150" fill="#c4c0d2">@ 负责人</text>
      <rect x="111" y="134" width="85" height="24" rx="12" fill="#24252d"/>
      <text class="ui win-text pill-text" x="132" y="150" fill="#c4c0d2">/ 待办</text>
      <text class="ui win-text win-faint" x="18" y="184">补充材料进入最终整理 prompt</text>
    </g>

    <g transform="translate(700 482)" filter="url(#soft-shadow)">
      <rect x="0" y="0" width="492" height="84" rx="12" fill="#1d1f28" stroke="#303244"/>
      <text class="ui win-h2" x="18" y="28">母本逐字稿</text>
      <text class="ui win-text win-muted" x="18" y="52">保留分段原始转写、时间轴和录音信息</text>
      <path d="M186 41 L228 41" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
      <path d="M222 35 L230 41 L222 47" fill="none" stroke="#62dcd0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="248" y="16" width="104" height="52" rx="10" fill="#27243b" stroke="#5a50a4"/>
      <text class="ui win-text" x="270" y="38">清稿</text>
      <text class="ui win-text win-muted" x="270" y="56">忠实可读稿</text>
      <path d="M370 41 L408 41" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
      <path d="M402 35 L410 41 L402 47" fill="none" stroke="#62dcd0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="424" y="16" width="50" height="52" rx="10" fill="#1e3032" stroke="#31817d"/>
      <text class="ui win-text" x="438" y="38">纪要</text>
      <text class="ui win-text win-muted" x="438" y="56">交付</text>
    </g>

    <g transform="translate(700 586)" filter="url(#soft-shadow)">
      <rect x="0" y="0" width="492" height="76" rx="12" fill="#1d1f28" stroke="#303244"/>
      <text class="ui win-h2" x="18" y="28">沉淀流水线</text>
      <g class="ui">
        <rect x="116" y="17" width="74" height="36" rx="18" fill="#29243b"/>
        <text class="win-text pill-text" x="137" y="39" fill="#c7bfff">人员</text>
        <rect x="198" y="17" width="74" height="36" rx="18" fill="#1e3032"/>
        <text class="win-text pill-text" x="219" y="39" fill="#90f0e7">待办</text>
        <rect x="280" y="17" width="74" height="36" rx="18" fill="#2b2a20"/>
        <text class="win-text pill-text" x="301" y="39" fill="#ffe19a">学习</text>
        <rect x="362" y="17" width="84" height="36" rx="18" fill="#32232b"/>
        <text class="win-text pill-text" x="383" y="39" fill="#ffb2c3">热词</text>
      </g>
      <text class="ui win-text win-faint" x="18" y="58">把会议里可复用的东西写回你的 vault</text>
    </g>
  </g>

  <rect x="532" y="170" width="700" height="520" rx="12" fill="none" stroke="#3d4050" opacity=".8"/>
</svg>
